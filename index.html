<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B0B0E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CTT">
    <meta name="referrer" content="no-referrer">
    
    <title>ChocolaTrichomes & Terps</title>
    
    <!-- External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Local Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header" id="appHeader">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="header-brand">ChocolaTrichomes</div>
            <div class="header-right">
                <div class="city-badge-header" id="villeBadge">Agadir</div>
                <button class="header-cart-btn" id="headerCartBtn" aria-label="Panier">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5">
                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 01-8 0"></path>
                    </svg>
                    <span class="header-cart-count" id="cartCount" style="display:none">0</span>
                </button>
            </div>
        </header>

        <!-- Sidebar Backdrop -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-item" data-category="smokeshop">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C10 6 4 8 4 14a8 8 0 0016 0c0-6-6-8-8-12z"></path></svg>
                </div>
                <span class="sidebar-label">Accessoires</span>
            </div>
            <div class="sidebar-item" data-category="herbvape">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"></path></svg>
                </div>
                <span class="sidebar-label">HerbVape</span>
            </div>
            <div class="sidebar-item" data-category="mostwanted">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>
                </div>
                <span class="sidebar-label" data-i18n="nav.mostwanted">Most Wanted</span>
            </div>
            <div class="sidebar-item" data-category="reviews">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
                </div>
                <span class="sidebar-label" data-i18n="nav.reviews">Avis</span>
            </div>
            <div class="sidebar-item sidebar-garden" data-category="garden">
                <div class="sidebar-icon">🌱</div>
                <span class="sidebar-label" data-i18n="nav.garden">TRC-Garden</span>
            </div>
            <div class="sidebar-item" data-category="all">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                    </svg>
                </div>
                <span class="sidebar-label">All</span>
            </div>
            <div class="sidebar-item" data-category="Drysift">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                        <path d="M7 17c1.5-2 3-3 5-3s3.5 1 5 3"></path>
                    </svg>
                </div>
                <span class="sidebar-label">Drysift</span>
            </div>
            <div class="sidebar-item" data-category="Frozen">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24">
                        <line x1="12" y1="2" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line>
                        <line x1="18.4" y1="5.6" x2="5.6" y2="18.4"></line>
                    </svg>
                </div>
                <span class="sidebar-label">Frozen</span>
            </div>
            <div class="sidebar-item" data-category="Static">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                </div>
                <span class="sidebar-label">Static</span>
            </div>
            <div class="sidebar-item" data-category="IceOlator">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                </div>
                <span class="sidebar-label">Ice O'Lator</span>
            </div>
            <div class="sidebar-item" data-category="Beldia">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </div>
                <span class="sidebar-label">Beldia</span>
            </div>
            <div class="sidebar-item" data-category="Weed">
                <div class="sidebar-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22V8"></path>
                        <path d="M12 8C10 4 6 2 2 2c4 2 7 5 10 6z"></path>
                        <path d="M12 8c2-4 6-6 10-6c-4 2-7 5-10 6z"></path>
                        <path d="M9 21h6"></path>
                    </svg>
                </div>
                <span class="sidebar-label">Weed</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content section-switching" id="mainContent">
            <!-- Dynamic content will be injected here by JavaScript -->
            <div class="products-grid" id="productsGrid">
                <div class="empty-state" style="grid-column:1/-1;text-align:center;padding:48px 20px">
                    <div class="empty-state-icon" style="font-size:40px">🤍</div>
                    <div class="empty-state-text">Aucun produit à afficher pour le moment</div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item active" data-page="home">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                <span class="nav-item-label">Home</span>
            </button>
            <button class="nav-item" data-page="search">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span class="nav-item-label">Search</span>
            </button>
            <button class="nav-item" data-page="favorites">
                <svg viewBox="0 0 24 24">
                    <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"></path>
                </svg>
                <span class="nav-item-label">Favoris</span>
            </button>
            <button class="nav-item" data-page="profile">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="nav-item-label">Profile</span>
            </button>
        </nav>

        <!-- Floating Action Buttons -->
        <button class="floating-support-btn" id="floatingSupportBtn" aria-label="Support">
            <svg viewBox="0 0 24 24">
                <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path>
            </svg>
        </button>
        <button class="floating-cart-btn" id="floatingCartBtn">
            <svg viewBox="0 0 24 24">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 01-8 0"></path>
            </svg>
            <span class="floating-cart-count" id="floatingCartCount" style="display:none">0</span>
        </button>
    </div>

    <!-- Local Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
